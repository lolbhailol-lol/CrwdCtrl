# CrwdCtrl API — Railway config-as-code
# Healthcheck + auto-restart so the service does not stay offline after crashes.

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 20
# Keep previous instance serving until the new one passes healthcheck
overlapSeconds = 30
drainingSeconds = 10
