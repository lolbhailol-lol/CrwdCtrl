services:
  - type: web
  - name: crwdctrl-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
    rootDir: ./

  - type: static
  - name: crwdctrl-frontend
    buildCommand: cd frontend && npm install && npm run build:prod
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://crwdctrl-mvp.onrender.com/api
      - key: VITE_APP_ENVIRONMENT
        value: production
    rootDir: ./