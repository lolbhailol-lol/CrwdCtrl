<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bagBody" x1="18" y1="12" x2="46" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="bagFront" x1="22" y1="28" x2="42" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="48" y1="20" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="bagShad" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#15803D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Pine tree (right background) -->
  <path d="M53 54 L53 46" stroke="#15803D" stroke-width="3" stroke-linecap="round"/>
  <path d="M53 46 L47 54 L59 54 Z" fill="#22C55E"/>
  <path d="M53 40 L48 48 L58 48 Z" fill="#4ADE80"/>
  <path d="M53 34 L49 42 L57 42 Z" fill="#86EFAC"/>

  <!-- Backpack main body -->
  <rect x="16" y="14" width="32" height="40" rx="8" fill="url(#bagBody)" filter="url(#bagShad)"/>

  <!-- Bag top flap -->
  <rect x="16" y="10" width="32" height="14" rx="6" fill="#4ADE80"/>
  <!-- Flap highlight -->
  <rect x="19" y="12" width="26" height="10" rx="4" fill="#86EFAC" opacity="0.4"/>

  <!-- Top handle -->
  <path d="M26 10 Q32 6 38 10" stroke="#15803D" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Front pocket -->
  <rect x="20" y="30" width="24" height="18" rx="5" fill="url(#bagFront)"/>
  <!-- Pocket zipper line -->
  <line x1="22" y1="37" x2="42" y2="37" stroke="#BBF7D0" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Pocket zipper pull -->
  <circle cx="32" cy="37" r="1.8" fill="#BBF7D0" opacity="0.9"/>

  <!-- Left shoulder strap -->
  <path d="M18 16 Q10 22 10 36 Q10 44 16 46" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Strap highlight -->
  <path d="M18 16 Q11 22 11 36 Q11 44 16 46" stroke="#4ADE80" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Side water bottle pocket -->
  <rect x="14" y="26" width="5" height="14" rx="2.5" fill="#22C55E" opacity="0.8"/>
  <rect x="14.5" y="27" width="4" height="3" rx="1" fill="#86EFAC" opacity="0.4"/>

  <!-- Buckle on front pocket -->
  <rect x="28" y="27" width="8" height="5" rx="2" fill="#FDE68A"/>
  <rect x="30" y="28.5" width="4" height="2" rx="1" fill="#F59E0B"/>
</svg>
