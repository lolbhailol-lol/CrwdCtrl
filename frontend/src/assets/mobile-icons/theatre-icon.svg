<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="happyMask" x1="8" y1="10" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="sadMask" x1="28" y1="24" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="maskShad" x="-8%" y="-8%" width="125%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sad mask (back, right) -->
  <path d="M30 26 Q30 20 38 18 Q50 16 54 24 Q58 30 56 40 Q54 50 46 52 Q38 54 32 48 Q28 44 30 38 Z"
        fill="url(#sadMask)" filter="url(#maskShad)"/>
  <!-- Sad mask highlight -->
  <path d="M34 22 Q42 18 50 22 Q56 26 54 34 Q50 20 34 22 Z" fill="white" opacity="0.2"/>
  <!-- Sad mask eyes -->
  <ellipse cx="38" cy="30" rx="3" ry="3.5" fill="#5B21B6"/>
  <ellipse cx="48" cy="28" rx="3" ry="3.5" fill="#5B21B6"/>
  <!-- Eye gloss -->
  <circle cx="39" cy="29" r="1" fill="white" opacity="0.6"/>
  <circle cx="49" cy="27" r="1" fill="white" opacity="0.6"/>
  <!-- Sad mouth (frown) -->
  <path d="M37 43 Q43 38 50 42" stroke="#5B21B6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Sad mask string holes -->
  <circle cx="30" cy="32" r="1.5" fill="#6D28D9" opacity="0.6"/>
  <circle cx="54" cy="40" r="1.5" fill="#6D28D9" opacity="0.6"/>
  <!-- Sad ribbon -->
  <path d="M54 40 Q58 42 58 48 Q56 52 52 50" stroke="#C4B5FD" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="2,2"/>

  <!-- Happy mask (front, left) -->
  <path d="M8 12 Q8 6 16 4 Q28 2 34 10 Q38 16 36 28 Q34 38 26 40 Q18 42 12 36 Q6 30 8 20 Z"
        fill="url(#happyMask)" filter="url(#maskShad)"/>
  <!-- Happy mask highlight -->
  <path d="M12 8 Q20 4 30 8 Q36 12 34 22 Q28 6 12 8 Z" fill="white" opacity="0.3"/>
  <!-- Happy mask eyes -->
  <!-- Left eye (happy arc) -->
  <path d="M13 18 Q16 14 19 18" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Right eye (happy arc) -->
  <path d="M23 16 Q26 12 29 16" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Happy mouth (smile) -->
  <path d="M14 28 Q21 36 30 30" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Happy mask cheek blush -->
  <ellipse cx="14" cy="26" rx="3" ry="2" fill="#FCA5A5" opacity="0.5"/>
  <ellipse cx="28" cy="24" rx="3" ry="2" fill="#FCA5A5" opacity="0.5"/>
  <!-- Happy mask string holes -->
  <circle cx="8" cy="20" r="1.5" fill="#D97706" opacity="0.7"/>
  <circle cx="36" cy="26" r="1.5" fill="#D97706" opacity="0.7"/>
  <!-- Happy ribbon -->
  <path d="M8 20 Q4 22 4 28 Q6 32 10 30" stroke="#FCD34D" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="2,2"/>
</svg>
