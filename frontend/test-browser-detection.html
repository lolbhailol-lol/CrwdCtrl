<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Detection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .result { padding: 15px; margin: 10px 0; border-radius: 8px; }
        .detected { background: #fef3c7; border: 2px solid #f59e0b; }
        .not-detected { background: #dcfce7; border: 2px solid #16a34a; }
        button { background: #3b82f6; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin: 5px; }
        button:hover { background: #2563eb; }
        .instructions { background: #f3f4f6; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🔍 Enhanced Browser Detection Test</h1>
    <p>This page tests the new in-app browser detection with platform-specific messaging.</p>
    
    <div id="results"></div>
    
    <h2>Test Actions</h2>
    <button onclick="testOpenInBrowser()">🌐 Test "Open in Browser"</button>
    <button onclick="showUserAgent()">📱 Show User Agent</button>
    <button onclick="testAllPlatforms()">🧪 Test All Platforms</button>

    <script>
        // Copy the enhanced detection functions from firebase.js
        const detectInAppBrowser = () => {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera || '';
            
            if (/Instagram/i.test(userAgent)) {
                return {
                    platform: 'Instagram',
                    detected: true,
                    icon: '📷',
                    instructions: 'Tap the ⋯ menu (three dots) at the top right, then tap "Open in Chrome" or "Open in Browser"'
                };
            }
            
            if (/FBAN|FBAV/i.test(userAgent)) {
                return {
                    platform: 'Facebook',
                    detected: true,
                    icon: '📘',
                    instructions: 'Tap "Open in Browser" at the bottom of the screen, or tap the ⋯ menu and select "Open in Chrome"'
                };
            }
            
            if (/Twitter/i.test(userAgent)) {
                return {
                    platform: 'Twitter',
                    detected: true,
                    icon: '🐦',
                    instructions: 'Tap the share button, then tap "Open in Browser" or "Open in Chrome"'
                };
            }
            
            if (/LinkedIn/i.test(userAgent)) {
                return {
                    platform: 'LinkedIn',
                    detected: true,
                    icon: '💼',
                    instructions: 'Tap the ⋯ menu at the top right, then tap "Open in external browser"'
                };
            }
            
            if (/WhatsApp/i.test(userAgent)) {
                return {
                    platform: 'WhatsApp',
                    detected: true,
                    icon: '💬',
                    instructions: 'Tap the ⋯ menu at the top right, then tap "Open in Browser"'
                };
            }
            
            if (/TikTok/i.test(userAgent)) {
                return {
                    platform: 'TikTok',
                    detected: true,
                    icon: '🎵',
                    instructions: 'Tap the ⋯ menu at the top right, then tap "Open in Browser"'
                };
            }
            
            if (/Snapchat/i.test(userAgent)) {
                return {
                    platform: 'Snapchat',
                    detected: true,
                    icon: '👻',
                    instructions: 'Tap the ⋯ menu, then tap "Open in Browser"'
                };
            }
            
            const genericInAppBrowsers = [
                /Line/i,
                /Telegram/i,
                /WeChat/i,
                /QQ/i,
                /wv|WebView/i
            ];
            
            const isGenericInApp = genericInAppBrowsers.some(regex => regex.test(userAgent));
            
            if (isGenericInApp) {
                return {
                    platform: 'In-App Browser',
                    detected: true,
                    icon: '🌐',
                    instructions: 'Look for a menu button (⋯ or ⚙️) and tap "Open in Browser" or "Open in Chrome"'
                };
            }
            
            return {
                platform: null,
                detected: false,
                icon: null,
                instructions: null
            };
        };

        const openInDefaultBrowser = () => {
            try {
                const newWindow = window.open(window.location.href, '_blank', 'noopener,noreferrer');
                
                if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                    window.location.href = window.location.href;
                }
                
                return true;
            } catch (error) {
                console.error('Failed to open in browser:', error);
                
                try {
                    navigator.clipboard.writeText(window.location.href);
                    alert('URL copied to clipboard! Please paste it in your browser.');
                } catch (clipboardError) {
                    alert(`Please copy this URL and open it in your browser:\n\n${window.location.href}`);
                }
                
                return false;
            }
        };

        function displayResults() {
            const browserInfo = detectInAppBrowser();
            const resultsDiv = document.getElementById('results');
            
            if (browserInfo.detected) {
                resultsDiv.innerHTML = `
                    <div class="result detected">
                        <h2>${browserInfo.icon} ${browserInfo.platform} Detected!</h2>
                        <p><strong>Platform:</strong> ${browserInfo.platform}</p>
                        <div class="instructions">
                            <strong>Instructions:</strong><br>
                            ${browserInfo.instructions}
                        </div>
                        <button onclick="openInDefaultBrowser()" style="background: #16a34a;">
                            🌐 Open in Browser
                        </button>
                    </div>
                `;
            } else {
                resultsDiv.innerHTML = `
                    <div class="result not-detected">
                        <h2>✅ Regular Browser Detected</h2>
                        <p>You're using a regular browser. Social login should work normally!</p>
                        <p><strong>Browser:</strong> ${navigator.userAgent.split(' ')[0]}</p>
                    </div>
                `;
            }
        }

        function testOpenInBrowser() {
            const success = openInDefaultBrowser();
            if (success) {
                alert('✅ Open in browser function executed successfully!');
            } else {
                alert('⚠️ Open in browser function had issues (check console)');
            }
        }

        function showUserAgent() {
            alert(`User Agent:\n\n${navigator.userAgent}`);
        }

        function testAllPlatforms() {
            const testCases = [
                'Mozilla/5.0 (iPhone; CPU iPhone OS 14_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Instagram 154.0.0.37.124',
                'Mozilla/5.0 (Linux; Android 10; SM-G973F) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/88.0.4324.181 Mobile Safari/537.36 [FBAN/EMA;FBLC/en_US;FBAV/239.0.0.10.109;]',
                'Mozilla/5.0 (iPhone; CPU iPhone OS 14_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Twitter for iPhone',
                'Mozilla/5.0 (Linux; Android 10; SM-G973F) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/88.0.4324.181 Mobile Safari/537.36 LinkedInApp',
                'Mozilla/5.0 (iPhone; CPU iPhone OS 14_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 WhatsApp/2.21.71'
            ];

            let results = 'Test Results:\n\n';
            testCases.forEach((ua, index) => {
                // Temporarily override userAgent for testing
                Object.defineProperty(navigator, 'userAgent', {
                    value: ua,
                    configurable: true
                });
                
                const browserInfo = detectInAppBrowser();
                results += `${index + 1}. ${browserInfo.detected ? browserInfo.platform : 'Regular Browser'}\n`;
            });

            // Restore original userAgent
            location.reload();
            
            alert(results);
        }

        // Run detection on page load
        displayResults();
    </script>
</body>
</html>
