<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Theme before paint — same logic as DarkModeProvider -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('crwdctrl-theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <!-- Primary SEO -->
  <title>CrwdCtrl — Discover fests, clubs &amp; events</title>
  <meta name="description" content="CrwdCtrl helps you find college fests, tech and sports events, running clubs, gym communities, and meetups near you." />
  <meta name="application-name" content="CrwdCtrl" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161718" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#0E0E0F" />
  <link rel="canonical" href="https://www.crwdctrl.in/" />

  <!-- Favicon / site icon (shown in Google Search results) -->
  <link rel="icon" type="image/png" href="/favicon.png" sizes="48x48" />
  <link rel="icon" type="image/png" href="/icon-192x192.png" sizes="192x192" />
  <link rel="icon" type="image/png" href="/icon-512x512.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CrwdCtrl" />
  <meta property="og:title" content="CrwdCtrl — Discover fests, clubs &amp; events" />
  <meta property="og:description" content="Find college fests, tech and sports events, running clubs, gym communities, and meetups near you on CrwdCtrl." />
  <meta property="og:url" content="https://www.crwdctrl.in/" />
  <meta property="og:image" content="https://www.crwdctrl.in/logo-crwdctrl.png" />
  <meta property="og:image:alt" content="CrwdCtrl logo" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="CrwdCtrl — Discover fests, clubs &amp; events" />
  <meta name="twitter:description" content="Find college fests, tech and sports events, running clubs, gym communities, and meetups near you." />
  <meta name="twitter:image" content="https://www.crwdctrl.in/logo-crwdctrl.png" />

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CrwdCtrl" />

  <!-- Structured data for Google (brand + logo) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.crwdctrl.in/#organization",
        "name": "CrwdCtrl",
        "alternateName": ["crwdctrl", "Crwd Ctrl"],
        "url": "https://www.crwdctrl.in",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.crwdctrl.in/logo-crwdctrl.png",
          "width": 512,
          "height": 512
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://www.crwdctrl.in/#website",
        "url": "https://www.crwdctrl.in",
        "name": "CrwdCtrl",
        "description": "Discover college fests, sports events, running clubs, and student communities.",
        "publisher": { "@id": "https://www.crwdctrl.in/#organization" }
      }
    ]
  }
  </script>

  <!-- OAuth and Firebase compatibility headers -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />

  <!-- Poppins — app-wide font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Instant boot splash — light / dark matches app theme -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    html, body {
      margin: 0;
      overflow-x: clip;
      background: #ffffff;
      min-height: 100%;
      min-height: 100svh;
      min-height: 100dvh;
    }
    html.dark, html.dark body { background: #161718; }

    /* Boot logo — five vertical slices converge (classy) */
    @keyframes bootSliceMerge {
      from {
        opacity: 0;
        transform: translate3d(var(--boot-slice-x, 0), var(--boot-slice-y, 8%), 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }
    @keyframes bootLogoSettle {
      from { transform: scale(1.02); opacity: 0.96; }
      to { transform: scale(1); opacity: 1; }
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    html.dark #boot-splash {
      background: #161718;
    }
    .boot-splash-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .boot-logo-assemble {
      --boot-slice-count: 5;
      --boot-logo-size: clamp(9.5rem, 54vw, 13rem);
      display: flex;
      width: var(--boot-logo-size);
      height: var(--boot-logo-size);
      animation: bootLogoSettle 0.28s cubic-bezier(0.22, 1, 0.36, 1) 0.36s both;
    }
    .boot-logo-slice {
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      overflow: hidden;
      opacity: 0;
      animation: bootSliceMerge 0.5s cubic-bezier(0.22, 1, 0.36, 1) var(--boot-slice-delay, 0s) forwards;
    }
    .boot-logo-slice img {
      display: block;
      width: calc(var(--boot-slice-count) * 100%);
      height: 100%;
      max-width: none;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      pointer-events: none;
      user-select: none;
      margin-left: calc(var(--boot-slice-index) * -100%);
    }
    #boot-splash.boot-splash-out {
      opacity: 0;
      transition: opacity 0.32s cubic-bezier(0.45, 0, 0.55, 1);
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-logo-assemble { animation: none; transform: none; opacity: 1; }
      .boot-logo-slice { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>

<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-splash-inner">
      <div class="boot-logo-assemble">
        <div class="boot-logo-slice" style="--boot-slice-index:0;--boot-slice-x:-16%;--boot-slice-y:3%;--boot-slice-delay:0s">
          <img src="/crwdctrl-mark.png" alt="" width="500" height="500" decoding="sync" />
        </div>
        <div class="boot-logo-slice" style="--boot-slice-index:1;--boot-slice-x:-9%;--boot-slice-y:-2%;--boot-slice-delay:0.03s">
          <img src="/crwdctrl-mark.png" alt="" width="500" height="500" decoding="sync" />
        </div>
        <div class="boot-logo-slice" style="--boot-slice-index:2;--boot-slice-x:0%;--boot-slice-y:7%;--boot-slice-delay:0.06s">
          <img src="/crwdctrl-mark.png" alt="" width="500" height="500" decoding="sync" />
        </div>
        <div class="boot-logo-slice" style="--boot-slice-index:3;--boot-slice-x:9%;--boot-slice-y:-2%;--boot-slice-delay:0.09s">
          <img src="/crwdctrl-mark.png" alt="" width="500" height="500" decoding="sync" />
        </div>
        <div class="boot-logo-slice" style="--boot-slice-index:4;--boot-slice-x:16%;--boot-slice-y:3%;--boot-slice-delay:0.12s">
          <img src="/crwdctrl-mark.png" alt="" width="500" height="500" decoding="sync" />
        </div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <!-- Boot splash fallback + stale-deploy recovery (runs before React) -->
  <script>
    (function () {
      var FADE_MS = 320;
      var MAX_MS = 2500;
      var RECOVER_KEY = 'crwdctrl_boot_recover';

      function dismissBootSplash() {
        var el = document.getElementById('boot-splash');
        if (!el || el.dataset.removing === '1') return;
        el.dataset.removing = '1';
        el.classList.add('boot-splash-out');
        var remove = function () { el.remove(); };
        el.addEventListener('transitionend', remove, { once: true });
        setTimeout(remove, FADE_MS + 80);
      }

      function reloadFresh() {
        var url = new URL(window.location.href);
        url.searchParams.set('_crwd', String(Date.now()));
        window.location.replace(url.toString());
      }

      function recoverStaleDeploy() {
        try {
          if (sessionStorage.getItem(RECOVER_KEY)) return;
          sessionStorage.setItem(RECOVER_KEY, '1');
        } catch (e) {}

        var cleanup = ('caches' in window)
          ? caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            })
          : Promise.resolve();

        cleanup.finally(function () {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
              .finally(reloadFresh);
          } else {
            reloadFresh();
          }
        });
      }

      window.addEventListener('error', function (event) {
        var target = event.target;
        if (!target || target.tagName !== 'SCRIPT') return;
        var src = target.src || '';
        if (src.indexOf('/assets/') === -1 && src.indexOf('.js') === -1) return;
        recoverStaleDeploy();
      }, true);

      setTimeout(dismissBootSplash, MAX_MS);

      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.childNodes.length) {
          recoverStaleDeploy();
        }
      }, 4000);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
