<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Theme before paint — same logic as DarkModeProvider -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('crwdctrl-theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <!-- Primary SEO -->
  <title>CrwdCtrl — Discover fests, clubs &amp; events</title>
  <meta name="description" content="CrwdCtrl helps you find college fests, tech and sports events, running clubs, gym communities, and meetups near you." />
  <meta name="application-name" content="CrwdCtrl" />
  <meta name="theme-color" content="#0E0E0F" />
  <link rel="canonical" href="https://www.crwdctrl.in/" />

  <!-- Favicon / site icon (shown in Google Search results) -->
  <link rel="icon" type="image/png" href="/favicon.png" sizes="48x48" />
  <link rel="icon" type="image/png" href="/icon-192x192.png" sizes="192x192" />
  <link rel="icon" type="image/png" href="/icon-512x512.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CrwdCtrl" />
  <meta property="og:title" content="CrwdCtrl — Discover fests, clubs &amp; events" />
  <meta property="og:description" content="Find college fests, tech and sports events, running clubs, gym communities, and meetups near you on CrwdCtrl." />
  <meta property="og:url" content="https://www.crwdctrl.in/" />
  <meta property="og:image" content="https://www.crwdctrl.in/logo-crwdctrl.png" />
  <meta property="og:image:alt" content="CrwdCtrl logo" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="CrwdCtrl — Discover fests, clubs &amp; events" />
  <meta name="twitter:description" content="Find college fests, tech and sports events, running clubs, gym communities, and meetups near you." />
  <meta name="twitter:image" content="https://www.crwdctrl.in/logo-crwdctrl.png" />

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CrwdCtrl" />

  <!-- Structured data for Google (brand + logo) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.crwdctrl.in/#organization",
        "name": "CrwdCtrl",
        "alternateName": ["crwdctrl", "Crwd Ctrl"],
        "url": "https://www.crwdctrl.in",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.crwdctrl.in/logo-crwdctrl.png",
          "width": 512,
          "height": 512
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://www.crwdctrl.in/#website",
        "url": "https://www.crwdctrl.in",
        "name": "CrwdCtrl",
        "description": "Discover college fests, sports events, running clubs, and student communities.",
        "publisher": { "@id": "https://www.crwdctrl.in/#organization" }
      }
    ]
  }
  </script>

  <!-- OAuth and Firebase compatibility headers -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />

  <!-- Poppins — app-wide font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Instant boot splash — light / dark matches app theme -->
  <style>
    html, body { margin: 0; background: #ffffff; }
    html.dark, html.dark body { background: #161718; }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }
    html.dark #boot-splash { background: #161718; }
    #boot-splash img {
      width: clamp(6rem, 38vw, 9.5rem);
      height: clamp(6rem, 38vw, 9.5rem);
      max-width: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }
  </style>
</head>

<body>
  <div id="boot-splash" aria-hidden="true">
    <img src="/crwdctrl-mark.png" alt="" width="500" height="500" decoding="sync" />
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
