<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CrwdCtrl — Offline</title>
  <style>
    html, body { margin: 0; height: 100%; background: #161718; color: #f5f5f5; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 0; max-width: 320px; color: #a8a8a8; line-height: 1.5; }
    button { margin-top: 8px; padding: 12px 28px; border: 0; border-radius: 999px; background: #f5f5f5; color: #161718; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>CrwdCtrl needs an internet connection. Check your network and try again.</p>
    <button type="button" onclick="window.location.href='https://www.crwdctrl.in'">Try again</button>
  </main>
  <script>
    window.addEventListener('online', function () { window.location.href = 'https://www.crwdctrl.in'; });
  </script>
</body>
</html>
